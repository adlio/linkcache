[package]
name = "linkcache"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Link search utility"

[features]
default = ["lib"]
lib = []
bin = []

[[bin]]
name = "linkcache"
path = "src/bin/linkcache/main.rs"
required-features = ["bin"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
filetime = "0.2"
itertools = "0.14"
lazy_static = "1.5"
log = "0.4"
rusqlite = { version = "0.34", features = ["bundled", "chrono"] }
rusqlite_migration = "1.3"
rust-ini = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sublime_fuzzy = "0.7"
tempfile = "3.19"

# Binary-only dependencies
alfrusco = "0.3"
clap = "4.5"
env_logger = "0.11"
